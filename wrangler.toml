# wrangler.toml
name = 'openlistnext'
main = "src/backend/worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"
VITE_API_URL = "/api"
# 本实例的管理员是 KV 中的用户 "cage"（role=2），并非 "admin"。
# ADMIN_USERNAME 代码从不读取；ADMIN_PASSWORD 只作用于字面名为 "admin"
# 的用户，因此两者对本实例均无效，已移除（也避免明文口令进 public 仓库）。
# 改密码请在后台「用户」页面对 "cage" 操作，新哈希写回 KV。
# 注意：[[kv_namespaces]] 的 id 必须保留，缺失会导致仪表盘 Git 部署
# 触发「请更新您的存储库中的 wrangler.toml，以保持一致的设置」一致性校验失败。

[[kv_namespaces]]
binding = "OPENLISTNEXT_KV"
id = "0225009baba041a684c700d3127091f5"
